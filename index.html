<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learn by Playing</title>
  <meta name="description" content="Small browser games that teach programming languages by making you use them.">
  <meta name="theme-color" content="#0d0d10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='44' rx='8' fill='%2316171b' stroke='%23e8e3d8' stroke-width='4'/%3E%3Cpath d='M18 26l8 6-8 6' stroke='%23ffb648' stroke-width='5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M32 40h14' stroke='%23e8e3d8' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --bg: #0d0d10; --card: #16171c; --card2: #1c1d23; --line: #2a2b33; --text: #ece8df; --muted: #9a978f; --dim: #64625d;
      --display: 'Space Grotesk', system-ui, sans-serif; --mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background:
        linear-gradient(#ffffff06 1px, transparent 1px) 0 0 / 100% 32px,
        radial-gradient(900px 500px at 85% -10%, #2a1f12 0%, transparent 60%),
        radial-gradient(800px 500px at -10% 30%, #10202a 0%, transparent 60%),
        var(--bg);
      color: var(--text); font: 16px/1.55 var(--display); min-height: 100vh;
      display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid #ffb648; outline-offset: 3px; }
    .wrap { width: min(1160px, 100% - 40px); margin: 0 auto; }

    header { padding: 72px 0 36px; }
    .kicker { font: 500 13px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase; display: flex; gap: 10px; align-items: center; }
    .kicker::before { content: ''; width: 28px; height: 1px; background: var(--muted); }
    h1 { font-size: clamp(44px, 8vw, 96px); line-height: .95; letter-spacing: -.035em; margin: 18px 0 18px; font-weight: 700; }
    h1 .cursor { display: inline-block; width: .5em; height: .82em; background: #ffb648; vertical-align: -.06em; margin-left: .06em; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .tagline { font-size: clamp(17px, 2vw, 21px); color: #cfcac0; max-width: 640px; margin: 0; }
    .facts { margin-top: 22px; display: flex; gap: 8px; flex-wrap: wrap; }
    .facts span { font: 13px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }

    main { flex: 1; padding-bottom: 64px; }
    .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 22px; }

    .cart {
      --accent: #ffb648;
      display: flex; flex-direction: column; text-decoration: none; border-radius: 16px; overflow: hidden;
      background: var(--card); border: 1px solid var(--line);
      transition: transform .18s ease, border-color .18s, box-shadow .18s;
    }
    @media (hover: hover) { a.cart:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); box-shadow: 0 22px 50px -24px color-mix(in srgb, var(--accent) 55%, transparent); } a.cart:hover .play { transform: translateX(3px); } }
    a.cart:active { transform: scale(.985); }
    a.cart { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .screen {
      position: relative; aspect-ratio: 16 / 8.5; overflow: hidden;
      background:
        radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%),
        #0a0a0d;
      border-bottom: 1px solid var(--line);
    }
    .screen::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, #ffffff05 0 1px, transparent 1px 3px); pointer-events: none; }
    .ghost { position: absolute; top: 18px; left: 20px; right: 20px; margin: 0; font: 13px/1.7 var(--mono); color: var(--accent); opacity: .55; white-space: pre; overflow: hidden; }
    .ghost .k { color: #fff; opacity: .9; }
    .lang { position: absolute; left: 18px; bottom: 6px; font: 700 clamp(48px, 6vw, 68px)/1 var(--display); letter-spacing: -.04em; color: var(--accent); text-shadow: 0 0 30px color-mix(in srgb, var(--accent) 45%, transparent); }
    .emblem { position: absolute; right: 18px; bottom: 16px; width: 56px; height: 56px; opacity: .95; }
    .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .no { font: 500 12px var(--mono); color: var(--dim); letter-spacing: .1em; }
    .cart h2 { margin: 0; font-size: 26px; line-height: 1.1; letter-spacing: -.02em; }
    .cart p { margin: 0; color: #c3beb4; font-size: 15.5px; }
    .topics { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
    .topics li { font: 12.5px var(--mono); color: var(--muted); background: var(--card2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; }
    .meta { margin-top: auto; padding-top: 10px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .progress { font: 13px var(--mono); color: var(--muted); }
    .progress b { color: var(--accent); font-weight: 500; }
    .play { font-weight: 700; color: #0d0d10; background: var(--accent); border-radius: 9px; padding: 8px 14px; white-space: nowrap; transition: transform .15s; }

    .cart.soon { border-style: dashed; background: transparent; }
    .cart.soon .screen { background: repeating-linear-gradient(135deg, #ffffff05 0 10px, transparent 10px 20px), #0a0a0d; }
    .cart.soon .lang { color: var(--dim); text-shadow: none; }
    .cart.soon .play { background: transparent; color: var(--dim); border: 1px dashed var(--line); }

    footer { border-top: 1px solid var(--line); padding: 22px 0 calc(30px + env(safe-area-inset-bottom)); color: var(--dim); font-size: 14px; }
    footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    footer a { color: var(--muted); }
    @media (max-width: 560px) { header { padding: 44px 0 26px; } .wrap { width: calc(100% - 28px); } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="kicker" id="kicker"></div>
    <h1 id="title"></h1>
    <p class="tagline" id="tagline"></p>
    <div class="facts" id="facts"></div>
  </header>
  <main class="wrap"><div class="shelf" id="shelf"></div></main>
  <footer><div class="wrap" id="foot"></div></footer>

  <script>
    /* ====================================================================
       EDIT HERE. Each game is one entry; `path` is its folder in this repo
       (or a full https:// URL if a game lives somewhere else).
       ==================================================================== */
    const SERIES = {
      title: 'Learn by Playing',
      kicker: 'A series of browser games',
      tagline: 'Small games that teach programming languages by making you use them. No installs, no accounts: open one and start playing.',
      author: 'Md. Abid Chowdhury',
      authorUrl: 'https://mdabidchowdhury.github.io/',
    };

    const GAMES = [
      {
        path: 'sql/',
        title: 'Sherlock Holmes: The SQL Sleuth',
        lang: 'SQL',
        accent: '#d9bb7f',
        blurb: 'Solve ten Victorian mysteries by questioning a Scotland Yard archive with SQL.',
        topics: ['JOIN', 'WITH (CTEs)', 'GROUP BY · HAVING', 'subqueries'],
        snippet: ['SELECT p.name, a.claim', '  FROM persons p', '  JOIN alibis a ON a.person_id = p.id', ' WHERE a.verified = 0;'],
        emblem: 'glass',
        progress() {
          const d = JSON.parse(localStorage.getItem('sqlSleuth.v2') || '{}');
          const cases = Object.values(d.cases || {});
          const solved = cases.filter((c) => c && c.solved).length;
          const opened = cases.some((c) => c && (c.openedAt || c.queries));
          if (!solved && !opened) return null;
          return `<b>${solved}/10</b> cases closed`;
        },
      },
      {
        path: 'quartermaster/',
        title: 'The Quartermaster',
        lang: 'Rust',
        accent: '#ffb648',
        blurb: 'Get crew plans past a borrow checker in disguise. Ownership, borrowing and lifetimes in ten levels.',
        topics: ['ownership', 'moves & Copy', '& and &mut', 'lifetimes'],
        snippet: ['let nova = &ada;', 'let kai = &mut log;', 'kai.push(entry);', 'println!("{nova}");'],
        emblem: 'hex',
        progress() {
          const p = JSON.parse(localStorage.getItem('quartermaster.progress.v1') || '{}');
          const stars = Object.values(p.stars || {});
          if (!stars.length) return null;
          return `<b>${stars.length}/10</b> levels · <b>${stars.reduce((a, b) => a + b, 0)}/30</b> ★`;
        },
      },
      {
        path: 'soc-logger/',                            // ← the SOC Logger's folder
        title: 'The SOC Logger',
        lang: 'Python',
        accent: '#4cc9f0',
        blurb: 'Learn Python on a security operations shift: parse logs, audit activity and practise basic blue-team defence.',   // ← one-line pitch
        topics: ['log parsing', 'auditing', 'blue teaming', 'Python basics'],                                                    // ← what it covers
        snippet: ['for line in open("auth.log"):', '    if "Failed password" in line:', '        ip = line.split()[-4]', '        fails[ip] += 1'],
        emblem: 'shield',
        // progress() { ... }  ← optional: read its localStorage and return e.g. '<b>3/8</b> incidents closed'
      },
    ];
    /* ==================================================================== */

    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const EMBLEMS = {
      hex: (c) => `<svg class="emblem" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3L57 17V47L32 61L7 47V17Z" fill="#141414" stroke="${c}" stroke-width="2.5"/><circle cx="32" cy="12.5" r="2.4" fill="${c}"/><rect x="15" y="23" width="34" height="12" rx="6" fill="#0a0a0d" stroke="${c}" stroke-width="1.5"/><rect x="18.5" y="26.5" width="27" height="5" rx="2.5" fill="${c}"/><path d="M23 45h18" stroke="${c}" stroke-width="2" stroke-linecap="round" opacity=".7"/></svg>`,
      shield: (c) => `<svg class="emblem" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 5L54 13V30C54 44 44.5 54.5 32 59C19.5 54.5 10 44 10 30V13Z" fill="#0c141a" stroke="${c}" stroke-width="2.6" stroke-linejoin="round"/><path d="M22 32l7 7 13-14" fill="none" stroke="${c}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
      glass: (c) => `<svg class="emblem" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="${c}" stroke-linecap="round"><circle cx="27" cy="27" r="16" stroke-width="3"/><path d="M18.5 23.5a10 10 0 0 1 8-6.5" stroke-width="1.8" opacity=".7"/><path d="M39 39L54 54" stroke-width="7"/></g></svg>`,
      table: (c) => `<svg class="emblem" viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="10" width="52" height="44" rx="6" fill="#0f1218" stroke="${c}" stroke-width="2.5"/><path d="M6 24h52M6 38h52M26 10v44" stroke="${c}" stroke-width="2" opacity=".75"/><rect x="8" y="12" width="48" height="10" rx="3" fill="${c}" opacity=".35"/></svg>`,
    };

    document.title = SERIES.title;
    document.getElementById('kicker').textContent = SERIES.kicker;
    document.getElementById('title').innerHTML = esc(SERIES.title) + '<span class="cursor" aria-hidden="true"></span>';
    document.getElementById('tagline').textContent = SERIES.tagline;
    const playable = GAMES.filter((g) => !g.soon);
    document.getElementById('facts').innerHTML = [
      `${playable.length} game${playable.length === 1 ? '' : 's'}`,
      playable.map((g) => g.lang).join(' · '),
      'runs in any browser',
    ].map((f) => `<span>${esc(f)}</span>`).join('');

    let n = 0;
    document.getElementById('shelf').innerHTML = GAMES.map((g) => {
      n++;
      const accent = g.accent || '#64625d';
      let prog = null;
      if (g.progress) { try { prog = g.progress(); } catch (e) { prog = null; } }
      const ghost = g.snippet.map((l) => esc(l).replace(/^(\s*)(SELECT|FROM|JOIN|WHERE|ORDER BY|let|fn|for|if|def|import|return)\b/, '$1<span class="k">$2</span>')).join('\n');
      const inner = `
        <div class="screen">
          <pre class="ghost" aria-hidden="true">${ghost}</pre>
          <span class="lang">${esc(g.lang)}</span>
          ${g.emblem && EMBLEMS[g.emblem] ? EMBLEMS[g.emblem](accent) : ''}
        </div>
        <div class="body">
          <div class="no">No. ${String(n).padStart(2, '0')}</div>
          <h2>${esc(g.title)}</h2>
          <p>${esc(g.blurb)}</p>
          ${g.topics.length ? `<ul class="topics">${g.topics.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>` : ''}
          <div class="meta">
            <span class="progress">${prog || (g.soon || !g.progress ? '' : 'not started')}</span>
            <span class="play">${g.soon ? 'Soon' : (prog ? 'Continue →' : 'Play →')}</span>
          </div>
        </div>`;
      return g.soon
        ? `<div class="cart soon" style="--accent:${accent}">${inner}</div>`
        : `<a class="cart" href="${esc(g.path)}" style="--accent:${accent}" aria-label="Play ${esc(g.title)} (${esc(g.lang)})">${inner}</a>`;
    }).join('');

    document.getElementById('foot').innerHTML =
      `<span>${esc(SERIES.title)} · ${new Date().getFullYear()}</span>` +
      (SERIES.author ? `<span>Made by <a href="${esc(SERIES.authorUrl || '#')}">${esc(SERIES.author)}</a></span>` : '');
  </script>
</body>
</html>
